<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IRONPULSE — Hero</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { display: ['"Archivo Black"', 'Impact', 'sans-serif'], body: ['Inter', 'system-ui', 'sans-serif'] },
    colors: { ember: '#FF5A1F', graphite: '#17181B', burnt: '#3A1A0C' }
  } } };
</script>
<link rel="stylesheet" href="style.css">
</head>
<body class="text-white antialiased">

<!-- ===== HERO ===== -->
<section class="hero-bg relative min-h-screen w-full overflow-hidden">

  <!-- Nav mínima -->
  <header class="relative z-30 mx-auto flex max-w-7xl items-center justify-between px-6 py-6 lg:px-10">
    <a href="#" class="font-display text-xl tracking-tight">IRON<span class="text-ember">PULSE</span></a>
    <a href="#planos" class="rounded-full border border-white/20 px-5 py-2 text-sm text-white/80 transition hover:border-ember hover:text-white">Entrar</a>
  </header>

  <div class="relative mx-auto grid max-w-7xl grid-cols-1 items-center gap-6 px-6 pb-16 pt-4 lg:min-h-[calc(100vh-88px)] lg:grid-cols-2 lg:gap-0 lg:px-10 lg:pb-0">

    <!-- ===== COLUNA ESQUERDA ===== -->
    <div class="relative z-20 order-2 flex flex-col justify-center lg:order-1">
      <h1 id="title" aria-label="Treine mais forte. Viva sem limites."
          class="font-display text-[clamp(2.75rem,8.2vw,6.6rem)] uppercase leading-[.92] tracking-tight">
        <span class="line" data-line>Treine mais</span>
        <span class="line" data-line>forte. Viva</span>
        <span class="line text-ember" data-line>sem limites.</span>
      </h1>

      <p class="mt-7 max-w-md text-base leading-relaxed text-white/60 sm:text-lg">
        Planos de treino feitos para o seu ritmo, com acompanhamento em tempo real de calorias, gordura e batimentos.
      </p>

      <div class="mt-9 flex flex-wrap items-center gap-x-8 gap-y-5">
        <a href="#planos" class="btn-main inline-flex items-center rounded-lg bg-ember px-8 py-4 text-sm font-semibold text-white">
          Começar agora
        </a>
        <button type="button" class="btn-play group flex items-center gap-3 text-sm font-medium text-white/85">
          <span class="play-ring relative grid h-12 w-12 place-items-center rounded-full border border-white/30">
            <svg viewBox="0 0 24 24" class="ml-0.5 h-4 w-4 fill-current" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
          </span>
          Assistir vídeo
        </button>
      </div>
    </div>

    <!-- ===== COLUNA DIREITA ===== -->
    <div class="relative order-1 mx-auto flex h-[420px] w-full max-w-[560px] items-end justify-center sm:h-[520px] lg:order-2 lg:h-[min(88vh,760px)] lg:max-w-none" id="stage">

      <!-- Círculo abstrato + pincelada -->
      <div class="absolute left-1/2 top-1/2 aspect-square w-[78%] -translate-x-1/2 -translate-y-1/2" data-depth="12">
        <div class="orb h-full w-full">
          <svg viewBox="0 0 400 400" class="h-full w-full" aria-hidden="true">
            <defs>
              <radialGradient id="g1" cx="35%" cy="30%" r="80%">
                <stop offset="0" stop-color="#FF8A3D"/><stop offset=".6" stop-color="#FF5A1F"/><stop offset="1" stop-color="#C2330A"/>
              </radialGradient>
              <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="22"/></filter>
            </defs>
            <circle cx="200" cy="200" r="170" fill="url(#g1)" opacity=".95"/>
            <path d="M40 250 C110 150, 250 120, 360 190" fill="none" stroke="#FFB27A" stroke-width="26" stroke-linecap="round" opacity=".35" filter="url(#rough)"/>
            <circle cx="200" cy="200" r="190" fill="none" stroke="#FF5A1F" stroke-opacity=".35" stroke-dasharray="3 9"/>
          </svg>
        </div>
      </div>

      <!-- ATLETA: troque o src por um PNG recortado (fundo transparente). Enquanto vazio, mostra a silhueta SVG. -->
      <div class="relative z-10 flex h-[92%] items-end justify-center" data-depth="4">
        <img id="athlete" src="atleta.png" alt="Atleta treinando" class="hidden h-full w-auto max-w-full object-contain drop-shadow-[0_30px_40px_rgba(0,0,0,.5)]">
        <svg id="athlete-fallback" viewBox="0 0 300 520" class="h-full w-auto" role="img" aria-label="Silhueta de atleta (substitua por sua imagem)">
          <defs><linearGradient id="sil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2c31"/><stop offset="1" stop-color="#0f0f11"/></linearGradient></defs>
          <g fill="url(#sil)" stroke="#FF5A1F" stroke-opacity=".5" stroke-width="2">
            <circle cx="150" cy="58" r="34"/>
            <rect x="136" y="88" width="28" height="30" rx="8"/>
            <path d="M60 135 Q150 105 240 135 L226 270 Q150 292 74 270 Z"/>
            <path d="M60 135 Q22 150 24 230 L22 330 Q40 346 62 330 L76 230 Q86 170 84 140 Z"/>
            <path d="M240 135 Q278 150 276 230 L278 330 Q260 346 238 330 L224 230 Q214 170 216 140 Z"/>
            <path d="M82 268 L218 268 L206 330 L94 330 Z"/>
            <path d="M94 330 L146 330 L136 520 L88 520 Z"/>
            <path d="M154 330 L206 330 L212 520 L164 520 Z"/>
          </g>
        </svg>
      </div>

      <!-- Card 1: Top-Left -->
      <div class="absolute left-0 top-[8%] z-20 sm:left-2 lg:-left-4" data-depth="22">
        <div class="float glass w-44 rounded-2xl p-4 sm:w-52" style="--dur:6.2s;--delay:0s">
          <div class="flex h-14 items-end gap-1.5" aria-hidden="true">
            <span class="bar w-full rounded-sm bg-ember/40" style="--b:0;height:35%"></span>
            <span class="bar w-full rounded-sm bg-ember/60" style="--b:1;height:55%"></span>
            <span class="bar w-full rounded-sm bg-ember/50" style="--b:2;height:45%"></span>
            <span class="bar w-full rounded-sm bg-ember/80" style="--b:3;height:75%"></span>
            <span class="bar w-full rounded-sm bg-ember" style="--b:4;height:100%"></span>
          </div>
          <p class="mt-3 text-xs font-medium text-black/50">Calories Burned</p>
          <p class="text-xl font-semibold leading-tight">320 <span class="text-sm font-medium text-black/60">kcal</span></p>
        </div>
      </div>

      <!-- Card 2: Bottom-Left -->
      <div class="absolute bottom-[14%] left-0 z-20 sm:left-4 lg:left-0" data-depth="30">
        <div class="float glass flex items-center gap-3 rounded-2xl px-4 py-3" style="--dur:7.4s;--delay:-2.3s">
          <span class="grid h-10 w-10 place-items-center rounded-xl bg-ember/15 text-ember">
            <svg viewBox="0 0 24 24" class="h-5 w-5 fill-current" aria-hidden="true"><path d="M12.6 2.2c.3 3-1.2 4.6-2.7 6.3C8.5 10 7 11.700 7 14.300A5 5 0 0 0 12 19.300a5 5 0 0 0 5-5c0-1.800-.8-3.100-1.700-4.200-.3 1.100-.9 1.800-1.700 2.200.6-3.600-.2-7.700-1-10.100zM12 21.800c-3.900 0-7-2.900-7-6.800 0-2.800 1.500-4.700 3-6.400 1.300-1.500 2.700-3 2.200-5.700l.3-.5c1.200.5 2.200 1.500 2.800 2.800.4.900.7 1.900.8 3 .9-.4 1.600-1.200 1.900-2.300 1.500 1.800 2.500 3.700 2.500 6.100 0 4-3.600 7.800-6.500 7.800z"/></svg>
          </span>
          <div><p class="text-xs font-medium text-black/50">Fat Burning</p><p class="text-lg font-semibold leading-tight">57%</p></div>
        </div>
      </div>

      <!-- Card 3: Bottom-Right -->
      <div class="absolute bottom-[26%] right-0 z-20 sm:right-2 lg:-right-2" data-depth="18">
        <div class="float glass flex items-center gap-3 rounded-2xl px-4 py-3" style="--dur:5.6s;--delay:-4s">
          <span class="grid h-10 w-10 place-items-center rounded-xl bg-red-500/15 text-red-500">
            <svg viewBox="0 0 24 24" class="beat h-5 w-5 fill-current" aria-hidden="true"><path d="M12 21s-7.500-4.600-9.600-9.200C1 8.600 2.800 5 6.200 5c2 0 3.300 1 3.800 2 .5-1 1.800-2 3.800-2 3.400 0 5.200 3.600 3.800 6.800C19.500 16.400 12 21 12 21z" transform="translate(.2 -.5)"/></svg>
          </span>
          <div><p class="text-xs font-medium text-black/50">Heart Rate</p><p class="text-lg font-semibold leading-tight">212 <span class="text-sm font-medium text-black/60">bpm</span></p></div>
        </div>
      </div>
    </div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
